name: daily-loop

# Primary cloud scheduler for the Venture Factory daily loop.
# Runs in GitHub Actions (free tier, ubuntu-latest) so the loop fires 24/7
# without the operator's Mac being awake. The launchd LaunchAgent
# (scripts/install_schedule.sh) remains in place as an optional local fallback.

on:
  schedule:
    # GitHub cron is UTC and has NO timezone / DST handling.
    # 03:00 UTC == 06:00 Asia/Jerusalem during IDT (summer, UTC+3).
    # In winter (IST, UTC+2) this same line lands at 05:00 local — acceptable;
    # we deliberately do NOT try to handle DST in cron.
    - cron: "0 3 * * *"
  # Manual trigger from the Actions tab (Run workflow button).
  workflow_dispatch:

# Needed so the job can commit results back to the repo with GITHUB_TOKEN.
permissions:
  contents: write

# Never let two daily runs overlap (state.db is a single-writer SQLite file).
# Do not cancel an in-flight run; queue behind it instead.
concurrency:
  group: daily-loop
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Job-level boolean (NOT the token value) so the publish step can gate on it:
    # the `secrets` context isn't available in a step-level `if`, but `env` is.
    env:
      HAS_DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_DEPLOY_TOKEN != '' }}
    steps:
      - name: Checkout
        # Default GITHUB_TOKEN has push rights here thanks to the permissions block above.
        uses: actions/checkout@v4

      - name: Install uv
        # Pin to a major version of the official Astral action.
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        # uv resolves Python 3.11 (per .python-version) and installs from uv.lock.
        run: uv sync --frozen

      - name: Write .env from secrets
        # NEVER echo the key. printf writes it directly; chmod locks it down.
        # .env is gitignored and is never staged in the commit-back step below.
        # Commented lines are ready for the secrets that prompt C will add.
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' "${{ secrets.ANTHROPIC_API_KEY }}" > .env
          # printf 'RESEND_API_KEY=%s\n'       "${{ secrets.RESEND_API_KEY }}"       >> .env
          # printf 'STRIPE_API_KEY=%s\n'       "${{ secrets.STRIPE_API_KEY }}"       >> .env
          # printf 'CLOUDFLARE_API_TOKEN=%s\n' "${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env
          chmod 600 .env

      - name: Run daily loop
        id: loop
        # Capture the exit code without hard-failing the job, so partial results
        # still get committed back below. The code is surfaced at the very end.
        # The Shabbat read-only window is enforced INSIDE run_daily_loop.py; the
        # cron can fire normally on Fri/Sat and the loop self-limits.
        run: |
          set +e
          uv run daily-loop
          code=$?
          set -e
          echo "loop_exit=$code" >> "$GITHUB_OUTPUT"
          echo "Daily loop exited with code $code"

      - name: Build dashboard export
        # Regenerate the sanitized dashboard/data.json (+ keep index.html versioned).
        # Read-only over the repo + state.db; hard-fails if it would emit a secret/PII.
        run: uv run build-dashboard

      - name: Commit results back
        run: |
          git config user.name  "venture-factory-bot"
          git config user.email "actions@github.com"

          # State persistence (critical): the runner is wiped after each run, but
          # factory/state.db holds the spend ledger and rate-limit timestamps.
          # It is gitignored (.gitignore line 19), so force-add it to carry
          # within-day accounting + dedup state across runs. Per-day spend caps
          # still reset daily by design — this only preserves intra-day state.
          git add -f factory/state.db || true

          # Explicit paths only — NEVER `git add -A` (keeps .env out of the commit).
          git add opportunities/ reports/ logs/runs/ opportunities/_seen.jsonl dashboard/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit — skipping (no empty commits)."
          else
            git commit -m "chore(factory): daily run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publish dashboard to public mirror
        # Cross-repo publish: push the sanitized dashboard (index.html + data.json)
        # to the PUBLIC Pages mirror so the live site refreshes daily. The default
        # GITHUB_TOKEN can't push to another repo, so this uses a fine-grained PAT
        # (Contents: write on the mirror only) stored as DASHBOARD_DEPLOY_TOKEN.
        # Skipped automatically if that secret is not set. Runs BEFORE the exit-code
        # surfacing so partial-but-clean results still publish even if the loop
        # exited non-zero. (If the export tripped its leak self-check, the earlier
        # build step already failed the job and we never get here.)
        if: env.HAS_DASHBOARD_TOKEN == 'true'
        env:
          # Actions masks secret values in logs; the token is never echoed.
          DASHBOARD_DEPLOY_TOKEN: ${{ secrets.DASHBOARD_DEPLOY_TOKEN }}
          MIRROR: YouvalPolacsekCode/venture-factory-dashboard
        run: |
          tmp="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${DASHBOARD_DEPLOY_TOKEN}@github.com/${MIRROR}.git" "$tmp/mirror"
          cp dashboard/index.html "$tmp/mirror/index.html"
          cp dashboard/data.json  "$tmp/mirror/data.json"
          touch "$tmp/mirror/.nojekyll"   # serve files verbatim (no Jekyll build)
          git -C "$tmp/mirror" add index.html data.json .nojekyll
          if git -C "$tmp/mirror" diff --cached --quiet; then
            echo "Mirror unchanged — nothing to publish."
          else
            git -C "$tmp/mirror" \
              -c user.name="venture-factory-bot" -c user.email="actions@github.com" \
              commit -m "dashboard: publish $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C "$tmp/mirror" push origin HEAD:main
          fi

      - name: Surface loop exit code
        # Fail the job (for visibility / email) if the loop itself failed,
        # but only after results were committed back above.
        run: |
          code="${{ steps.loop.outputs.loop_exit }}"
          if [ "$code" != "0" ]; then
            echo "::error::daily-loop exited non-zero (code $code) — partial results were still committed."
            exit "$code"
          fi
          echo "daily-loop completed cleanly."

      - name: Failure summary
        if: failure()
        # GitHub emails the repo owner automatically when a scheduled workflow
        # fails; this just drops a one-line breadcrumb into the run log.
        run: echo "::error::Venture Factory daily-loop run FAILED — open this run's logs (Actions → daily-loop) to see which step broke."
