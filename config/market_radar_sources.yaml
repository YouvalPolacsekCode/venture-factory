schema_version: 1

# Signal sources for Market Radar. Add/remove via spend_above_daily_cap approval.
#
# Diversity matters: Market Radar interleaves these sources round-robin and caps
# the combined set (MAX_PREFETCH_ITEMS in scripts/run_agent.py), so no single
# platform dominates. All ENABLED sources below are no-auth and verified
# reachable from scripted/datacenter clients (incl. GitHub Actions).
sources:
  # --- Hacker News (Algolia search; open, no auth) -------------------------
  - id: hn_unmet_need
    type: hn
    description: 'HN comments expressing an explicit unmet need ("I wish there was…")'
    url_template: "https://hn.algolia.com/api/v1/search_by_date?query=%22I%20wish%20there%20was%20a%20tool%22&tags=comment&hitsPerPage=30"
    enabled: true
    rate_limit_rpm: 10

  # --- Lobsters (computing community; newest stories) ----------------------
  - id: lobsters_newest
    type: lobsters
    description: "Lobsters newest — developer-tooling friction and gaps"
    url_template: "https://lobste.rs/newest.json"
    enabled: true
    rate_limit_rpm: 10

  # --- Stack Exchange (Q&A; dense unmet-need / WTP language) ---------------
  - id: se_softwarerecs
    type: stackexchange
    description: "softwarerecs.stackexchange.com — people asking for a tool that does X"
    url_template: "https://api.stackexchange.com/2.3/questions?order=desc&sort=creation&site=softwarerecs&pagesize=30&filter=withbody"
    enabled: true
    rate_limit_rpm: 5

  - id: se_webapps
    type: stackexchange
    description: "webapps.stackexchange.com — gaps and frustrations with web tools"
    url_template: "https://api.stackexchange.com/2.3/questions?order=desc&sort=creation&site=webapps&pagesize=30&filter=withbody"
    enabled: true
    rate_limit_rpm: 5

  # --- DEV / Forem (maker + founder content; reaction-gated) --------------
  - id: devto_startup
    type: devto
    description: "dev.to articles tagged startup — maker/founder problems"
    url_template: "https://dev.to/api/articles?per_page=30&tag=startup&top=30"
    enabled: true
    rate_limit_rpm: 10
    min_reactions: 5

  # --- GitHub (open-source feature requests = concrete demand) ------------
  - id: github_feature_requests
    type: github
    description: 'GitHub open issues labelled "feature request" — sourced demand'
    url_template: "https://api.github.com/search/issues?q=label:%22feature+request%22+state:open+is:issue&sort=created&order=desc&per_page=30"
    enabled: true
    rate_limit_rpm: 6

  # --- Disabled: Reddit -----------------------------------------------------
  # Reddit's public *.json endpoints now return HTTP 403 to scripted clients
  # (and especially datacenter IPs). They fail silently (return []), which made
  # the pipeline look HN-only. Re-enable only after wiring Reddit OAuth (register
  # a "script" app -> REDDIT_CLIENT_ID/SECRET -> oauth.reddit.com endpoints).
  - id: reddit_sideproject
    type: reddit
    description: "r/SideProject — indie hackers (needs OAuth; 403 unauthenticated)"
    url_template: "https://www.reddit.com/r/SideProject/new.json?limit=50"
    enabled: false
    rate_limit_rpm: 5
    notes: "Disabled: 403 without OAuth. Enable via register_external_account approval."

  - id: reddit_entrepreneur
    type: reddit
    description: "r/Entrepreneur — small business pain (needs OAuth; 403 unauthenticated)"
    url_template: "https://www.reddit.com/r/Entrepreneur/new.json?limit=50"
    enabled: false
    rate_limit_rpm: 5
    notes: "Disabled: 403 without OAuth. Enable via register_external_account approval."

  - id: reddit_smallbusiness
    type: reddit
    description: "r/smallbusiness — operational friction (needs OAuth; 403 unauthenticated)"
    url_template: "https://www.reddit.com/r/smallbusiness/new.json?limit=50"
    enabled: false
    rate_limit_rpm: 5
    notes: "Disabled: 403 without OAuth. Enable via register_external_account approval."

  # --- Disabled: Product Hunt ----------------------------------------------
  - id: ph_launches
    type: ph
    description: "Product Hunt recent launches — surface whitespace where winners exist"
    url_template: "https://api.producthunt.com/v2/api/graphql"
    enabled: false
    notes: "Requires PH API key. Enable via register_external_account approval."

# Dedupe ledger — path written by market_radar, read at startup for dedup
seen_ledger: "opportunities/_seen.jsonl"

# Candidate output directory
candidate_output_dir: "opportunities"
