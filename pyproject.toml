[project]
name = "venture-factory"
version = "0.1.0"
description = "AI Venture Factory agent runner"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.1.0",
    "python-ulid>=3.0.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
smoke = "scripts.smoke_test:main"
cost-report = "scripts.cost_report:main"
safety = "scripts.test_safety:_run"
daily-loop = "scripts.run_daily_loop:main"
inbox = "scripts.approvals_inbox:main"
brief = "scripts.brief:main"
build-dashboard = "scripts.build_dashboard:main"
score-calibration = "scripts.score_calibration:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
